<!DOCTYPE html>
<html>
<head>
    <title>EXPENSE TRACKER</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="logic.js"></script>

</head>

<body>

    <!--==================== Navigation Bar ====================-->

    <nav class="navbar navbar-expand-lg navbar-dark bg-info">
        <div class="container mt-2 mb-2">
            <a class="navbar-brand" href="#">EXPENSE TRACKER</a>
        </div>
    </nav>



    <div class="container mt-3 ">
    <!--==================== Dashboard ====================-->
        <h1>DASHBOARD</h1>

        <div class="auto-grid row g-3 mb-4">

            <div class="col-lg-2 col-md-4">
                <div class="card-body text-center" style="background-color: #be0bbe; border-color: #3e123f;">
                    <h6>Total Expense</h6>
                    <h3 id="totalExpense">₹0</h3>
                </div>
            </div>

            <div class="col-lg-2 col-md-4">
                <div class="card-body text-center">
                    <h6>Average Expense</h6>
                    <h3 id="avgExpense">₹0</h3>
                </div>
            </div>

            <div class="col-lg-2 col-md-4">
                <div class="card-body text-center">
                    <h6>Highest Expense</h6>
                    <h3 id="highestExpense">₹0</h3>
                </div>
            </div>

            <div class="col-lg-2 col-md-4">
                <div class="card-body text-center">
                    <h6>This Month</h6>
                    <h3 id="thisMonth">₹0</h3>
                </div>
            </div>

            <div class="col-lg-2 col-md-4">
                <div class="card-body text-center">
                    <h6>Total Entries</h6>
                    <h3 id="totalEntries">0</h3>
                </div>
            </div>

        </div>

        <!--==================== Add Expense ====================-->

        <div class="AddExpense">

            <label class="form-label ">
                <h3>Add Expense</h3>
            </label>

            <form id="expenseForm">

                <div class="row g-3 mb-4">

                    <div class="col-md-4">
                        <label>Expense Name</label>
                        <input type="text"
                               class="form-control"
                               id="expenseName"
                               placeholder="Expense Name"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label>Expense Amount</label>
                        <input type="number"
                               class="form-control"
                               id="expenseAmount"
                               placeholder="Expense Amount"
                               min="0"
                               max="9999999"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label>Expense Date</label>
                        <input type="date"
                               class="form-control"
                               id="expenseDate"
                               required>
                    </div>

                    <!-- ===========================Category ============================-->

                    <div class="col-md-4">

                        <label>Category</label>

                        <select id="expenseCategory" class="form-select">

                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <!-- ===========================Payment Method ============================ -->

                    <div class="col-md-4">

                        <label>Payment Method</label>

                        <select id="paymentMethod" class="form-select">

                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Net Banking">Net Banking</option>

                        </select>

                    </div>

                    <div class="col-12 text-end">

                        <button type="submit" class="btn btn-primary">

                            Add Expense

                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!--==================== Expense History ====================-->

        <div class="card">

            <div class="card-header bg-success">

                <h4 class="mb-0">

                    Expense History

                </h4>

            </div>

            <div class="card-header bg-light">

                <div class="row">

                    <div class="col-lg-3">

                        <input
                            type="text"
                            id="searchExpense"
                            class="form-control"
                            placeholder="Search by category or name">

                    </div>

                    <div class="col-lg-3">

                        <select
                            id="sortExpense"
                            class="form-select">

                            <option value="default">Sort Expenses</option>
                            <option value="low">Amount Low → High</option>
                            <option value="high">Amount High → Low</option>
                            <option value="new">Newest First</option>
                            <option value="old">Oldest First</option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover table-bordered align-middle">

                        <thead class="table-success">

                            <tr>

                                <th>Date</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Payment</th>
                                <th>Name</th>
                                <th width="170">Action</th>

                            </tr>

                        </thead>

                        <tbody id="expenseTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
